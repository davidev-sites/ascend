<title>ASCEND</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0f14;--card:#151b24;--card2:#1c2430;--txt:#e8eef7;--mut:#8b9bb0;--acc:#7cff9b;--acc2:#38d9ff;--line:#243040;--red:#ff6b6b;--yel:#ffd166}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:84px}
body.f1{font-size:14px}body.f2{font-size:15px}body.f3{font-size:17px}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(11,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#hdr b{font-size:15px;letter-spacing:2px}
#gear{background:var(--card2);border:0;color:var(--txt);font-size:19px;width:44px;height:44px;border-radius:12px;cursor:pointer}
#view{padding:14px 14px 24px;max-width:520px;margin:0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(15,20,27,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:0;border:0;color:var(--mut);font-size:10.5px;font-weight:600;padding:9px 0 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
#nav button i{font-style:normal;font-size:19px;line-height:1}
#nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;color:var(--mut);text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.big{font-size:32px;font-weight:800;letter-spacing:-1px}
button.bt{background:var(--acc);color:#06120a;border:0;border-radius:12px;padding:13px 16px;font-size:14.5px;font-weight:700;cursor:pointer;min-height:46px;width:100%}
button.gh{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
button.mini{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;min-height:40px}
button.dgr{background:0;border:0;color:var(--red);font-size:13px;cursor:pointer;padding:8px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:15px;font-family:inherit;min-height:46px}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 5px;font-weight:600}
.bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:38px}
.chip.on{background:rgba(124,255,155,.16);border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.task{display:flex;align-items:flex-start;gap:11px;padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:13px;margin-bottom:8px}
.task.done{opacity:.5}
.task.done .tname{text-decoration:line-through}
.chk{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--mut);background:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#06120a;font-size:15px;font-weight:900;margin-top:1px}
.chk.on{background:var(--acc);border-color:var(--acc)}
.tname{font-weight:600;font-size:14.5px}
.sub{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);padding:7px 0;cursor:pointer;min-height:38px}
.sub .chk{width:19px;height:19px;min-width:19px;border-radius:6px;font-size:11px;border-width:1.5px}
.sub.on{color:var(--acc);text-decoration:line-through}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:11px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11px;color:var(--mut)}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal>div{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#22303f;color:var(--txt);padding:12px 16px;border-radius:12px;font-size:13.5px;z-index:200;display:none;align-items:center;gap:12px;max-width:92%}
#toast.open{display:flex}
#toast button{background:0;border:0;color:var(--acc);font-weight:800;font-size:13.5px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;background:var(--card2);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;cursor:pointer;position:relative;border:1px solid transparent;min-height:40px}
.cal .d.empty{background:0;cursor:default}
.cal .d.met{border-color:var(--acc);background:rgba(124,255,155,.12)}
.cal .d.rest{opacity:.5}
.cal .d .n{font-weight:700}
.cal .d .e{font-size:8px;line-height:1;letter-spacing:-1px}
.cal .d .st{position:absolute;top:2px;right:3px;font-size:8px}
.hm{display:flex;gap:6px}
.hm button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;min-height:44px;font-size:18px;cursor:pointer}
.hm button.on{border-color:var(--acc);background:rgba(124,255,155,.16)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:0;border:0;color:var(--mut);padding:10px 4px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;min-height:42px}
.seg button.on{background:var(--card);color:var(--acc)}
.list{max-height:290px;overflow:auto;margin-top:8px}
.pick{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.pick:active{background:var(--card2)}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.ring .in{width:80px;height:80px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:19px;font-weight:800;line-height:1}
.ring .in span{font-size:9.5px;color:var(--mut)}
.wk{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:4px}
.wk .b{height:16px;background:var(--card2);border-radius:5px;overflow:hidden}
.wk .b>div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#onb{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:28px 22px;text-align:center}
#onb.open{display:flex}
#onb .ic{font-size:54px;margin-bottom:16px}
#onb h2{margin:0 0 10px;font-size:22px}
#onb p{color:var(--mut);font-size:14.5px;margin:0 0 26px}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:22px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);display:block}
.dots i.on{background:var(--acc);width:20px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>

<style>/* Interface local: mesma identidade, controles consistentes. */
:root{color-scheme:dark;--mut:#a2b1c3;--focus:#b5ffd0;--header:#0b0f14;--nav:#0f141b;--soft:#14251d}

html{scroll-padding-top:90px;scrollbar-color:var(--mut) var(--bg)}

::selection{background:var(--acc);color:var(--bg)}
input,textarea{caret-color:var(--acc)}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:1}
button,input,select,textarea{font:inherit;touch-action:manipulation}
button{cursor:pointer;line-height:1.35}button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button:hover:not(:disabled){filter:brightness(1.07)}button:active:not(:disabled){transform:translateY(1px)}
[hidden]{display:none!important}
.skip-link{position:fixed;top:-90px;left:12px;z-index:1000;padding:12px;background:var(--acc);color:var(--bg);border-radius:8px}.skip-link:focus{top:12px}
#hdr{background:var(--header);backdrop-filter:none;padding:12px max(16px,calc((100% - 560px)/2));gap:16px;min-height:74px}

.brand-mark{width:30px;height:30px;color:var(--acc)}
#gear{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;flex-shrink:0}
#view{max-width:560px;padding:22px 16px 20px;outline:none}
#view>h2{font-size:1.35em!important;letter-spacing:-.02em}
#nav{background:var(--nav);backdrop-filter:none;max-width:600px;margin:auto;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px #00000012}
#nav button{font-size:.65em;min-height:68px;padding:11px 2px 12px;gap:5px;font-weight:600}

.card{padding:18px;margin-bottom:16px;border-radius:16px}

h1{font-size:1.6em;line-height:1.2;letter-spacing:-.035em;margin:0 0 8px}h2{line-height:1.3;letter-spacing:-.025em;margin:0 0 10px;font-size:1.35em}h3{font-size:1em}
.page-heading{margin:2px 0 24px}.page-heading p{margin:7px 0 0;color:var(--mut);font-size:.82em}
p{overflow-wrap:anywhere}p.sm{line-height:1.6}
.sm{font-size:.82em!important}.big{font-size:2.2em;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.row{gap:10px}.row>*{min-width:0}.grid2,.grid3{gap:10px}.grid2>*,.grid3>*{min-width:0}
button.bt,button.gh,button.mini,button.dgr,.chip{min-width:44px;min-height:44px;font-size:.84em}
button.bt{padding:13px 16px}button.mini{padding:9px 12px;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.full{width:100%;margin-top:10px}.empty{padding:28px 20px}.empty h2{font-size:1.3em}
input,select,textarea{font-size:1em;min-height:48px;max-width:100%;border-radius:10px}textarea{min-height:90px}
input[type="checkbox"]{width:24px;min-height:24px;flex:0 0 24px;accent-color:var(--acc)}
label{font-size:.82em;margin:16px 0 7px;line-height:1.45}
.task{padding:12px 9px;gap:8px;border-radius:12px;align-items:flex-start}.task.done{opacity:.78}
.tname{font-size:.93em!important;font-weight:650;line-height:1.4}
button.chk{position:relative;width:44px;height:44px;min-width:44px;min-height:44px;margin-top:0;border-radius:12px;font-size:20px}
.sub{width:100%;background:none;border:0;color:var(--mut);min-height:44px;padding:7px 0;font-size:.82em;gap:8px}
.sub .chk{border:1.5px solid var(--mut);width:22px;min-width:22px;height:22px;display:inline-flex;border-radius:6px}
.sub.on{color:var(--acc)}.sub.on .chk{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.task-edit{width:44px;height:44px;flex:0 0 44px;padding:9px!important}
.ring{width:94px;height:94px}.ring .in{width:80px;height:80px}.ring .in span{font-size:.62em}
.stat{border:1px solid var(--line);font-variant-numeric:tabular-nums}.stat b{font-size:1.3em;overflow-wrap:anywhere}.stat span{font-size:.7em}
.bar>div,.wk .b>div{background:var(--acc)}.bar{margin-top:8px}
.wk{grid-template-columns:minmax(70px,28%) 1fr;font-size:.75em;gap:10px}.wk>span{overflow-wrap:anywhere}
.seg button{min-height:44px;font-size:.8em}.hm button{min-width:44px}

.line-chart{width:100%;height:auto;max-height:200px;margin-top:14px}.goal-value{font-size:1.6em;font-weight:750;margin:16px 0 10px}.item-heading{margin:0 0 5px!important}.period-note{margin:14px 0 20px}
.heatmap{display:grid;grid-template-columns:repeat(21,minmax(0,1fr));gap:4px}.heatmap span{aspect-ratio:1;background:var(--card2);border-radius:2px}.heatmap .active{background:var(--soft);border:1px solid var(--acc)}.heatmap .met{background:var(--acc)}
.report{font-family:inherit;font-size:.82em;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0}.review,.friend{border-top:1px solid var(--line);padding:16px 0}.review p{font-size:.85em;margin:7px 0}summary{cursor:pointer;min-height:44px;align-content:center}
.cal{gap:3px}.cal .weekday{text-align:center;font-size:.75em;color:var(--mut);padding:5px 0 10px}.cal .d{font:inherit;color:var(--txt);min-height:44px;min-width:0;padding:2px;border:1px solid transparent;aspect-ratio:auto;height:56px}.cal .d .n{font-size:.78em}.cal .d .e{font-size:11px;letter-spacing:-2px}.cal .d .st{font-size:12px;right:2px;top:0;color:var(--acc)}.cal .d.met{border-color:var(--acc);background:var(--soft)}.cal .d.rest{opacity:1}.cal .d.today{outline:2px solid var(--mut);outline-offset:-3px}.cal .d.empty{border:0;height:auto;min-height:0}.calendar-card{padding:12px 9px}.month-nav{margin-bottom:14px}.calendar-legend{padding:0 4px}.day-tasks{font-size:.85em;padding-left:20px}.day-tasks li{margin:8px 0}

#addButton{background:var(--acc);color:var(--bg);border-color:var(--acc)}#quickButton{background:var(--card);color:var(--txt);width:48px;padding:12px}
#modal{padding:0 8px}#modal>div{max-width:560px;max-height:92dvh;max-height:92vh;position:relative;padding:24px 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid var(--line)}
#modal h2{padding-right:42px}.modal-close{position:absolute;right:12px;top:12px}.modal-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}.settings-group{padding:22px 0;border-top:1px solid var(--line);margin-top:20px}.settings-group h3{margin:0 0 12px;font-size:1em}.action-list{display:grid;gap:12px;margin-top:24px}.action-list button{text-align:left;padding:18px}.action-list span{display:block;font-weight:400;color:var(--mut);margin-top:7px;font-size:.85em}

function finiteNumber(value,min=0,max=Infinity){
  if(typeof value!=='number'&&typeof value!=='string') return null;

    if(!value||!/^[-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?$/i.test(value)) return null;
  }
  const n=Number(value);
  return Number.isFinite(n)&&n>=min&&n<=max?n:null;

function stateObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}

  if(value===null||typeof value==='string'||typeof value==='boolean') return value;
  if(typeof value==='number') return Number.isFinite(value)?value:null;
  if(typeof value!=='object'||depth>50||seen.has(value)) return null;
  seen.add(value);
  const out=Array.isArray(value)?[]:{};
  Object.keys(value).forEach(k=>{
    if(k==='__proto__'||k==='constructor'||k==='prototype') return;
    out[k]=safeStateCopy(value[k],seen,depth+1);
  });

  }

  s.font=integer(settings.font,2,1,3);
  s.theme=['system','light','dark'].includes(settings.theme)?settings.theme:'system';
  s.purpose=text(settings.purpose);
  s.lastBackup=validRecordDate(settings.lastBackup)?settings.lastBackup:(stateObject(d.meta)&&validRecordDate(d.meta.lastBackup)?d.meta.lastBackup:'');

    if(!validRecordDate(m.date)||!['in','out'].includes(m.type)||finiteNumber(m.value)===null) return null;
    const entry=Object.assign({},m,{id:safeId(m.id,map),date:m.date,type:m.type,value:Number(m.value),desc:text(m.desc,'Lançamento'),cat:text(m.cat,'Outros')});

    if(!validRecordDate(r.date)) return null;

      const e=raw.done[oldId];

      const id=idMaps.tasks.get(oldId)||(/^[a-zA-Z0-9_-]{1,100}$/.test(oldId)&&!['__proto__','constructor','prototype'].includes(oldId)?oldId:uid());

      const entry=Object.assign({},e,{full:e.full===true,subs:Array.isArray(e.subs)?[...new Set(e.subs.filter(x=>typeof x==='string'||typeof x==='number').map(safeSub).filter(Boolean))]:[]});
      ['awardedPoints','taskPoints'].forEach(n=>{if(e[n]!==undefined){const v=finiteNumber(e[n]);if(v!==null)entry[n]=v;else delete entry[n];}});
      if(Array.isArray(e.subIds)) entry.subIds=e.subIds.map(safeSub).filter(Boolean);
      if(Array.isArray(e.subNames)) entry.subNames=e.subNames.filter(x=>typeof x==='string');
      const task=state.tasks.find(t=>t.id===id);

      if(finiteNumber(entry.awardedPoints)===null)entry.awardedPoints=entry.full?entry.taskPoints:entry.subIds.length?Math.round(entry.taskPoints*entry.subs.filter(sub=>entry.subIds.includes(sub)).length/entry.subIds.length):0;
      day.done[id]=entry;
    });
    state.days[k]=day;imported++;
  });else if(d.days!==undefined) skipped++;
  const ui=stateObject(d.ui)?d.ui:{};
  state.ui=Object.assign({},DEF().ui,ui);
  if(!['hoje','metas','progresso','calendario','registro'].includes(ui.tab))state.ui.tab='hoje';

  ['taskSearch','taskFilter','gymSearch','foodHistorySearch','moneySearch'].forEach(k=>state.ui[k]=text(state.ui[k],DEF().ui[k]));
  if(!['all','month','week'].includes(state.ui.gymRange))state.ui.gymRange='all';
  if(!['day','all'].includes(state.ui.foodHistoryRange))state.ui.foodHistoryRange='day';
  if(!['all','in','out'].includes(state.ui.moneyTypeFilter))state.ui.moneyTypeFilter='all';
  if(stateObject(ui.focusTimer)&&finiteNumber(ui.focusTimer.remaining,0,1500000)!==null){
    const timer=Object.assign({},ui.focusTimer);

    timer.remaining=number(timer.remaining,1500000,0,1500000);
    timer.endAt=timer.endAt===null?null:number(timer.endAt,0);timer.startedAt=number(timer.startedAt,0);
    timer.date=validRecordDate(timer.date)?timer.date:todayKey();
    timer.token=/^[a-zA-Z0-9_-]{1,100}$/.test(timer.token||'')?timer.token:uid();
    state.ui.focusTimer=timer;
  }else state.ui.focusTimer=null;
  state.meta=Object.assign({},stateObject(d.meta)?d.meta:{},{app:'ASCEND',version:STORAGE_VERSION});
  state.meta.lastBackup=validRecordDate(state.meta.lastBackup)?state.meta.lastBackup:null;
  return {state,imported,skipped};
}

function storageError(message){
  STORAGE_ERROR=message||'';
  if(typeof document==='undefined') return;
  const el=document.getElementById('storageError');
  if(el){el.textContent=STORAGE_ERROR;el.hidden=!STORAGE_ERROR;}
}
function allowStorageWrite(){STORAGE_BLOCKED=false;storageError('');}
function load(){
  let raw,legacy=false,copyFailed=false;
  try{
    raw=localStorage.getItem(STORAGE_KEY);
    if(raw===null){
      for(const key of LEGACY_STORAGE_KEYS){
        raw=localStorage.getItem(key);
        if(raw!==null){legacy=true;break;}
      }
    }
  }catch(err){
    STORAGE_BLOCKED=true;
    LOAD_NOTICE='Não foi possível acessar o armazenamento. Seus dados desta sessão ainda podem ser exportados.';
    storageError(LOAD_NOTICE);return DEF();
  }
  if(raw===null) return DEF();
  if(legacy){
    try{localStorage.setItem(STORAGE_KEY,raw);}catch(err){
      copyFailed=true;STORAGE_BLOCKED=true;
      LOAD_NOTICE='Não foi possível copiar seus dados para o armazenamento do ASCEND. Os dados anteriores foram preservados. Exporte um backup antes de fechar o app.';
      storageError(LOAD_NOTICE);
    }
  }
  try{
    const result=normalizeState(JSON.parse(raw));
    if(result.skipped&&!legacy){
      try{localStorage.setItem(STORAGE_RECOVERY_KEY,raw);}catch(err){
        STORAGE_BLOCKED=true;
        storageError('Há itens inválidos nos dados e não foi possível guardar uma cópia de recuperação. Exporte os dados antes de importar um backup ou apagar os dados.');
      }
    }
    if(legacy&&!copyFailed)LOAD_NOTICE='Seus dados anteriores foram copiados com segurança. O conteúdo original foi preservado.';
    if(result.skipped) LOAD_NOTICE+=(LOAD_NOTICE?' ':'')+result.skipped+' item(ns) inválido(s) foram ignorados. O conteúdo original continua guardado.';
    return result.state;
  }catch(err){
    STORAGE_BLOCKED=true;
    LOAD_NOTICE='Os dados guardados não puderam ser lidos. O conteúdo original foi preservado. Importe um backup válido ou use Apagar dados nos ajustes para voltar a salvar.';
    storageError(LOAD_NOTICE);return DEF();
  }
}
let S=load();
function save(){
  if(STORAGE_BLOCKED){storageError(LOAD_NOTICE||'O salvamento está protegido. Importe um backup válido ou apague os dados nos ajustes.');return false;}
  try{
    S.meta=Object.assign({},S.meta,{app:'ASCEND',version:STORAGE_VERSION});
    localStorage.setItem(STORAGE_KEY,JSON.stringify(S));storageError('');return true;
  }catch(err){
    storageError('Não foi possível salvar no aparelho. Exporte um backup agora e libere espaço ou permita o armazenamento. Mantenha esta página aberta.');
    return false;
  }
}

/* ============ DATAS LOCAIS ============ */
function pad(n){return String(n).padStart(2,'0');}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return dk(new Date());}
function validDate(k){
  if(typeof k!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(k))return false;
  const [y,m,d]=k.split('-').map(Number);
  if(y<1||m<1||m>12||d<1||d>31)return false;
  const date=new Date(0);date.setFullYear(y,m-1,d);date.setHours(12,0,0,0);
  return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d;
}
function validRecordDate(k){return validDate(k)&&k<=todayKey();}
function pk(k){
  if(!validDate(k)) return new Date(NaN);
  const [y,m,d]=k.split('-').map(Number),date=new Date(0);
  date.setFullYear(y,m-1,d);date.setHours(0,0,0,0);return date;
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtBR(k){if(!validDate(k))return '—';const d=pk(k);return d.getDate()+'/'+pad(d.getMonth()+1);}

/* ============ PONTOS, RECORRÊNCIA E SEQUÊNCIA ============ */
function ptsOfTask(t,e){
  if(!e) return 0;
  if(Number.isFinite(e.awardedPoints)) return Math.max(0,e.awardedPoints);
  if(!t) return 0;
  const total=Number.isFinite(e.taskPoints)?e.taskPoints:t.points;
  const ids=Array.isArray(e.subIds)?e.subIds:(t.subs||[]).map(s=>s.id);
  if(e.full) return total;
  if(!ids.length) return 0;
  return Math.round(total*(e.subs||[]).filter(id=>ids.includes(id)).length/ids.length);
}
function dayGoal(k){
  const value=(S.days[k]||{}).goalPoints;
  return Number.isFinite(value)&&value>0?value:(S.settings.goalPoints||100);
}
function earnedPointsOf(k){
  const day=S.days[k];
  if(!day) return 0;
  const tasks=Object.entries(day.done||{}).reduce((sum,[id,e])=>sum+ptsOfTask(S.tasks.find(t=>t.id===id),e),0);
  return tasks+Math.max(0,Number(day.focus)||0)*15;
}
function metGoal(k){ return earnedPointsOf(k)>=dayGoal(k); }
function bonusPointsOf(k){ return metGoal(k)?25:0; }
function pointsOf(k){ return earnedPointsOf(k)+bonusPointsOf(k); }
function touchDay(k){
  if(!S.days[k]) S.days[k]={};
  const d=S.days[k];
  if(!Number.isFinite(d.goalPoints)||d.goalPoints<=0) d.goalPoints=S.settings.goalPoints||100;
  if(typeof d.rest!=='boolean') d.rest=(S.settings.restDays||[]).includes(pk(k).getDay());
  return d;
}
function captureDay(k){return S.days[k]?JSON.parse(JSON.stringify(S.days[k])):null;}
function saveDayMutation(k,before){
  if(save()!==false) return true;
  if(before===null) delete S.days[k];else S.days[k]=before;
  return false;
}
function snapshotTaskEntry(t,e){
  return Object.assign({},e,{
    awardedPoints:ptsOfTask(t,e),taskPoints:Number.isFinite(e.taskPoints)?e.taskPoints:t.points,
    taskName:e.taskName||t.name,area:e.area||t.area,
    subIds:Array.isArray(e.subIds)?e.subIds.slice():(t.subs||[]).map(s=>s.id),
    subNames:Array.isArray(e.subNames)?e.subNames.slice():(t.subs||[]).map(s=>s.name)
  });
}
function freezeTaskHistory(t){
  Object.values(S.days).forEach(day=>{
    if(day.done&&day.done[t.id]) day.done[t.id]=snapshotTaskEntry(t,day.done[t.id]);
  });
}
function completedTaskEntries(k){
  return Object.entries((S.days[k]||{}).done||{}).map(([id,e])=>{
    const t=S.tasks.find(x=>x.id===id);
    return {id,name:e.taskName||(t&&t.name)||'Tarefa arquivada',area:e.area||(t&&t.area)||'Pessoal',
      points:ptsOfTask(t,e),full:!!e.full,subs:e.subs||[]};
  });
}
function isRestDay(k){
  const d=S.days[k];
  return d&&typeof d.rest==='boolean'?d.rest:(S.settings.restDays||[]).includes(pk(k).getDay());
}
function isProtectedDay(k){ return isRestDay(k)||!!(S.days[k]||{}).autoRest; }
function taskOccursOn(t,k){
  if(!validDate(k)) return false;
  const r=t.recurrence||{},anchor=r.anchor||t.createdDate||S.settings.startedDate||todayKey();
  if(k<anchor||(t.createdDate&&k<t.createdDate)) return false;
  const d=pk(k);
  if(r.type==='interval'){
    const a=pk(anchor);
    const diff=(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000;
    return diff%Math.max(1,Math.round(r.interval||1))===0;
  }
  if(r.type==='monthly'){
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    return d.getDate()===Math.min(last,Math.max(1,Math.round(r.monthDay||pk(anchor).getDate())));
  }
  return (t.days||[]).includes(d.getDay());
}
function tasksOf(k){
  return S.tasks.filter(t=>taskOccursOn(t,k)).sort((a,b)=>(a.time||'').localeCompare(b.time||'')||a.name.localeCompare(b.name));
}
function graceWeekKey(k){
  const d=pk(k);
  return dk(addDays(d,-((d.getDay()+6)%7)));
}
let graceCache=null;
function syncGraceDays(force=false){
  const now=todayKey(),keys=Object.keys(S.days).filter(k=>validDate(k)&&k<now).sort();
  const stamp=keys.map(k=>k+':'+earnedPointsOf(k)+':'+dayGoal(k)+':'+String(S.days[k].rest)).join('|')+';'+(S.settings.restDays||[]).join(',')+';'+S.settings.startedDate+';'+S.settings.autoRest;
  if(!force&&graceCache&&graceCache.state===S&&graceCache.today===now&&graceCache.stamp===stamp) return;
  if(S.settings.autoRest===false){graceCache={state:S,today:now,stamp};return;}
  const first=keys.find(k=>k>=(S.settings.startedDate||k)&&metGoal(k));
  const protectedKeys=new Set(),usedWeeks=new Set();
  let active=false;
  if(first){
    for(let d=pk(first),limit=0;dk(d)<now&&limit<36600;d=addDays(d,1),limit++){
      const k=dk(d),week=graceWeekKey(k);
      if(metGoal(k)){ active=true; continue; }
      if(isRestDay(k)) continue;
      if(active&&!usedWeeks.has(week)){
        protectedKeys.add(k);usedWeeks.add(week);
      }else active=false;
    }
  }
  let changed=false,newGrace='';
  Object.entries(S.days).forEach(([k,d])=>{
    if(d.autoRest&&!protectedKeys.has(k)){ delete d.autoRest;changed=true; }
  });
  protectedKeys.forEach(k=>{
    if(!(S.days[k]||{}).autoRest){
      const d=touchDay(k);d.autoRest=true;changed=true;
      if(!d.graceNotified&&k===dk(addDays(pk(now),-1))){newGrace=k;d.graceNotified=true;}
    }
  });
  graceCache={state:S,today:now,stamp};
  if(changed) save();
  if(newGrace) setTimeout(()=>toast('Sua folga automática da semana protegeu a sequência de ontem.'),50);
}
function streak(){
  syncGraceDays();
  const now=todayKey(),start=S.settings.startedDate||now;
  let count=0;
  for(let d=pk(now),i=0;i<36600&&dk(d)>=start;d=addDays(d,-1),i++){
    const k=dk(d);
    if(metGoal(k)) count++;
    else if(isProtectedDay(k)) continue;
    else if(i>0) break;
  }
  return count;
}

function focusState(){
  if(!S.ui.focusTimer||typeof S.ui.focusTimer!=='object') S.ui.focusTimer={running:false,remaining:1500000,endAt:null,token:''};
  const f=S.ui.focusTimer;
  if(!Number.isFinite(f.remaining)||f.remaining<0||f.remaining>1500000) f.remaining=1500000;
  return f;
}
function focusRemaining(){const f=focusState();return f.running?Math.max(0,f.endAt-Date.now()):f.remaining;}
function clockStr(){
  const s=Math.ceil(focusRemaining()/1000);
  return pad(Math.floor(s/60))+':'+pad(s%60);
}
function focusCard(k){
  resumeFocusTimer();
  const f=focusState(),cycles=(S.days[k]||{}).focus||0;

    '<div class="big" id="fclock" role="timer" aria-label="Tempo restante do foco" style="margin:10px 0;color:var(--acc)">'+clockStr()+'</div>'+
    '<div class="row"><button type="button" class="gh" style="flex:1" id="fbtn" onclick="toggleFocus()">'+(f.running?'Pausar':f.remaining<1500000&&f.remaining>0?'Continuar':'Iniciar foco')+'</button>'+
    '<button type="button" class="mini" onclick="resetFocus()">Reiniciar</button></div>'+
    '<div class="sm mut" style="margin-top:8px">Pausar guarda o tempo restante, inclusive ao reabrir o app.</div></div>';
}
function resumeFocusTimer(){
  const f=focusState();
  if(!f.running){clearInterval(window.__fi);window.__ft=false;return;}
  if(!Number.isFinite(f.endAt)){f.running=false;f.remaining=1500000;save();return;}
  if(f.endAt<=Date.now()){completeFocus(false);return;}
  window.__ft=true;
  if(window.__focusToken===f.token&&window.__fi) return;
  clearInterval(window.__fi);window.__focusToken=f.token;
  window.__fi=setInterval(()=>{
    const current=focusState();
    if(!current.running||current.token!==window.__focusToken){clearInterval(window.__fi);window.__fi=null;return;}
    if(current.endAt<=Date.now()){completeFocus(true);return;}
    const clock=document.getElementById('fclock');if(clock) clock.textContent=clockStr();
  },500);
}
function completeFocus(repaint){
  const f=focusState();if(!f.running) return;
  clearInterval(window.__fi);window.__fi=null;window.__ft=false;
  f.running=false;f.remaining=0;f.endAt=null;
  const day=touchDay(todayKey());day.focus=(day.focus||0)+1;
  if(save()===false){if(repaint)render();else setTimeout(render,25);return;}
  if(navigator.vibrate) navigator.vibrate(120);
  setTimeout(()=>{toast('Foco concluído · +15 pontos');if(!repaint) render();},25);
  if(repaint) render();
}
function toggleFocus(){
  const f=focusState();
  if(f.running){
    f.remaining=focusRemaining();f.running=false;f.endAt=null;
    clearInterval(window.__fi);window.__fi=null;window.__ft=false;
  }else{
    if(!f.remaining) f.remaining=1500000;
    f.running=true;f.endAt=Date.now()+f.remaining;f.token=uid();f.startedAt=Date.now();f.date=todayKey();
  }
  if(save()===false){resumeFocusTimer();render();return;}
  resumeFocusTimer();render();toast(f.running?'Foco iniciado':'Foco pausado · tempo restante salvo');
}
function resetFocus(){
  clearInterval(window.__fi);window.__fi=null;window.__ft=false;
  S.ui.focusTimer={running:false,remaining:1500000,endAt:null,token:uid()};
  if(save()===false){render();return;}
  render();toast('Cronômetro reiniciado em 25 minutos');
}

function taskCompletion(t,full,subs){
  const entry={full,subs:subs.slice()};
  return Object.assign(snapshotTaskEntry(t,entry),{awardedPoints:full?t.points:((t.subs||[]).length?Math.round(t.points*subs.length/t.subs.length):0)});

function toggleTask(id,k=todayKey()){
  if(!validRecordDate(k)) return;
  const t=S.tasks.find(x=>x.id===id);if(!t||!taskOccursOn(t,k)) return;
  const before=captureDay(k);
  const day=touchDay(k);day.done=day.done||{};
  if(day.done[id]&&day.done[id].full) delete day.done[id];
  else day.done[id]=taskCompletion(t,true,(t.subs||[]).map(s=>s.id));
  const completed=!!day.done[id];
  if(!saveDayMutation(k,before)) return;
  render();toast(completed?'Tarefa concluída · '+t.points+' pontos':'Conclusão desmarcada');
}
function toggleSub(tid,sid){
  const k=todayKey(),t=S.tasks.find(x=>x.id===tid);
  if(!t||!(t.subs||[]).some(s=>s.id===sid)) return;
  const before=captureDay(k);
  const day=touchDay(k);day.done=day.done||{};
  const old=day.done[tid],ids=t.subs.map(s=>s.id);
  const selected=old&&old.full?ids.slice():((old&&old.subs)||[]).filter(id=>ids.includes(id));
  const i=selected.indexOf(sid);
  if(i>=0) selected.splice(i,1);else selected.push(sid);
  if(!selected.length) delete day.done[tid];
  else day.done[tid]=taskCompletion(t,selected.length===ids.length,selected);
  if(!saveDayMutation(k,before)) return;
  render();toast(selected.length?'Subtarefa salva · '+ptsOfTask(t,day.done[tid])+' de '+t.points+' pontos':'Subtarefa desmarcada');
}
function completeLateTask(id,k){
  if(k!==dk(addDays(pk(todayKey()),-1))) return;
  const t=S.tasks.find(x=>x.id===id);if(!t||!taskOccursOn(t,k)) return;
  const before=captureDay(k);
  const day=touchDay(k);day.done=day.done||{};
  day.done[id]=Object.assign(taskCompletion(t,true,t.subs.map(s=>s.id)),{completedLate:true,completedAt:todayKey()});
  if(!saveDayMutation(k,before)) return;
  syncGraceDays(true);render();toast('Concluída em '+fmtBR(k)+' · os pontos ficaram nesse dia');
}

function retainedSubtasks(old,names){
  const used=new Set(),out=names.map(name=>{
    const match=old.find(s=>s.name===name&&!used.has(s.id));
    if(match){used.add(match.id);return {id:match.id,name};}
    return null;
  });
  names.forEach((name,i)=>{
    if(out[i]) return;
    const match=old[i]&&!used.has(old[i].id)?old[i]:old.find(s=>!used.has(s.id));
    if(match) used.add(match.id);

function saveTask(id){
  const name=document.getElementById('ftName').value.trim();
  if(!name){toast('Dê um nome para a tarefa');return;}
  const points=Number(document.getElementById('ftPts').value);
  if(!Number.isInteger(points)||points<1||points>10000){toast('Use de 1 a 10.000 pontos inteiros');return;}
  const type=document.getElementById('ftRec').value,anchor=document.getElementById('ftStart').value;
  if(!validDate(anchor)){toast('Escolha uma data de início válida');return;}
  const days=[...document.querySelectorAll('#ftDays .chip.on')].map(c=>+c.dataset.d);
  if(type==='weekly'&&!days.length){toast('Escolha pelo menos um dia da semana');return;}
  const interval=Number(document.getElementById('ftEvery').value),monthDay=Number(document.getElementById('ftMonthDay').value);
  if(type==='interval'&&(!Number.isInteger(interval)||interval<1||interval>3650)){toast('Informe um intervalo inteiro de 1 a 3.650 dias');return;}
  if(type==='monthly'&&(!Number.isInteger(monthDay)||monthDay<1||monthDay>31)){toast('Use um dia do mês entre 1 e 31');return;}
  if(!id&&(!taskFormDraft||!taskFormDraft.isNew)) taskFormDraft={id:uid(),isNew:true,subs:[]};
  const targetId=id||taskFormDraft.id,old=S.tasks.find(t=>t.id===targetId);
  if(id&&!old) return;
  const names=document.getElementById('ftSubs').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(names.length>50||names.some(n=>n.length>160)){toast('Use até 50 subtarefas, com até 160 caracteres cada');return;}
  const previous=old?JSON.parse(JSON.stringify(old)):null,previousStart=S.settings.startedDate;
  if(old) freezeTaskHistory(old);
  const data={
    name,time:document.getElementById('ftTime').value||'08:00',days,points,
    area:document.getElementById('ftArea').value,remind:document.getElementById('ftRem').checked,
    subs:retainedSubtasks(old?old.subs:(taskFormDraft?.subs||[]),names),createdDate:old?old.createdDate||anchor:anchor,
    recurrence:{type,anchor,interval:type==='interval'?interval:1,monthDay:type==='monthly'?monthDay:pk(anchor).getDate()}
  };
  if(taskFormDraft)taskFormDraft.subs=JSON.parse(JSON.stringify(data.subs));
  if(old) Object.assign(old,data);else S.tasks.push(Object.assign({id:targetId},data));
  if(anchor<S.settings.startedDate) S.settings.startedDate=anchor;
  if(save()===false){
    S.settings.startedDate=previousStart;
    if(previous)S.tasks[S.tasks.findIndex(t=>t.id===targetId)]=previous;
    else S.tasks=S.tasks.filter(t=>t.id!==targetId);
    return;
  }
  taskFormDraft=null;
  closeModal();render();toast('Tarefa salva');
}
function duplicateTask(id){
  const source=S.tasks.find(t=>t.id===id);if(!source) return;
  const copy=JSON.parse(JSON.stringify(source));
  if(!taskDuplicateDraft||taskDuplicateDraft.sourceId!==id) taskDuplicateDraft={sourceId:id,id:uid()};
  copy.id=taskDuplicateDraft.id;copy.name=(source.name+' (cópia)').slice(0,160);copy.createdDate=todayKey();
  copy.recurrence=Object.assign({},copy.recurrence,{anchor:todayKey()});
  copy.subs=(copy.subs||[]).map(s=>({id:uid(),name:s.name}));
  S.tasks.push(copy);
  if(save()===false){S.tasks=S.tasks.filter(t=>t.id!==copy.id);return;}
  taskDuplicateDraft=null;
  closeModal();render();toast('Tarefa duplicada');editTask(copy.id);
}
function delTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t) return;
  const index=S.tasks.indexOf(t),removed=JSON.parse(JSON.stringify(t));freezeTaskHistory(t);

    if(!S.tasks.some(x=>x.id===id)) S.tasks.splice(Math.min(index,S.tasks.length),0,removed);

}

async function askNotif(){
  if(!('Notification' in window)){toast('Este navegador não oferece notificações. Os avisos dentro do app continuam disponíveis.');return;}
  try{const p=await Notification.requestPermission();S.settings.notif=p==='granted';save();toast(p==='granted'?'Notificações permitidas com o app aberto':'Você pode usar os avisos dentro do app.');}catch(e){toast('Não foi possível pedir permissão neste navegador.');}
}
function downloadJSON(value,name){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportData(){S.settings.lastBackup=todayKey();save();downloadJSON(S,'ascend-backup-'+todayKey()+'.json');toast('Backup gerado. Guarde o arquivo em um lugar seguro.');}
function exportDamagedData(){try{const raw=(!STORAGE_BLOCKED&&localStorage.getItem(STORAGE_RECOVERY_KEY))||localStorage.getItem(STORAGE_KEY)||localStorage.getItem(KEY);if(raw)downloadJSON(raw,'ascend-dados-originais-'+todayKey()+'.json');}catch(e){toast('O navegador não permitiu ler o armazenamento.');}}
async function importData(input){
  const file=input.files[0];if(!file)return;
  if(file.size>20*1024*1024){toast('Esse arquivo é muito grande. Use um backup de até 20 MB.');input.value='';return;}
  try{pendingImport=normalizeState(JSON.parse(await file.text()));
    openModal('<h2>Revisar restauração</h2><p>Foram encontrados <strong>'+pendingImport.imported+' itens válidos</strong> e '+pendingImport.skipped+' itens inválidos ignorados.</p><p class="mut sm">O backup vai substituir os dados deste app. Baixe uma cópia dos dados atuais antes de continuar.</p><button class="gh full" onclick="exportData()">Baixar dados atuais</button><div class="modal-actions"><button class="gh" onclick="pendingImport=null;closeModal()">Cancelar</button><button class="bt" onclick="confirmImport()">Restaurar backup</button></div>');
  }catch(e){toast('Backup inválido. Escolha um JSON do ASCEND com estrutura reconhecida.');input.value='';}
}
function confirmImport(){
  if(!pendingImport)return;const old=S,candidate=pendingImport,wasBlocked=STORAGE_BLOCKED;S=candidate.state;allowStorageWrite();
  if(!save()){S=old;STORAGE_BLOCKED=wasBlocked;toast('Não foi possível restaurar. Os dados atuais foram mantidos.');return;}
  pendingImport=null;document.getElementById('recoveryActions').hidden=true;closeModal();render();toast(candidate.imported+' itens restaurados'+(candidate.skipped?' · '+candidate.skipped+' inválidos ignorados':''));
}
function resetAll(){openModal('<h2>Apagar os dados deste app?</h2><p class="mut">Tarefas, metas e registros serão apagados deste navegador. Um backup JSON permite restaurá-los.</p><button class="gh full" onclick="exportData()">Baixar backup antes</button><label for="resetText">Digite APAGAR para confirmar</label><input id="resetText" autocomplete="off"><div class="modal-actions"><button class="gh" onclick="closeModal()">Cancelar</button><button class="gh" style="color:var(--red)" onclick="confirmReset()">Apagar dados</button></div>');}
function confirmReset(){
  if(document.getElementById('resetText').value!=='APAGAR'){toast('Digite APAGAR para confirmar.');return;}
  const old=S,wasBlocked=STORAGE_BLOCKED;S=DEF();S.settings.onboarded=true;allowStorageWrite();if(!save()){S=old;STORAGE_BLOCKED=wasBlocked;return;}
  try{localStorage.removeItem(STORAGE_RECOVERY_KEY);}catch(e){storageError('Os dados atuais foram apagados, mas não foi possível remover a cópia de recuperação do ASCEND. Libere o armazenamento e tente novamente.');}
  document.getElementById('recoveryActions').hidden=true;closeModal();render();toast('Dados deste app apagados');
}
function openFriends(){
  let h='<h2>Amigos por código</h2><p class="sm mut">Um retrato manual do progresso. Nada é enviado automaticamente; só compartilhe o código com quem quiser.</p><button class="gh full" onclick="shareFriendCode()">Copiar meu resumo</button><label for="friendCode">Código recebido</label><textarea id="friendCode" placeholder="Cole o código ASCEND2 aqui"></textarea><button class="bt" onclick="importFriendCode()">Adicionar ou atualizar amigo</button>';
  S.friends.forEach(f=>{h+='<div class="friend row sp"><div><strong>'+esc(f.name)+'</strong><p class="sm mut">'+fmtNum(f.points||0)+' pontos · sequência '+(f.streak||0)+'<br>Atualizado em '+esc(f.date||'—')+'</p></div><button class="mini" onclick="removeFriend(\''+f.id+'\')">Remover</button></div>';});openModal(h);
}
function shareFriendCode(){openModal('<h2>Meu resumo para compartilhar</h2><label for="friendName">Como quer aparecer?</label><input id="friendName" maxlength="60" value="'+esc(S.settings.displayName||'')+'" placeholder="Seu nome ou apelido"><p class="sm mut">O código inclui apenas nome, pontos de hoje, sequência e data.</p><button class="bt" onclick="makeFriendCode()">Copiar código</button>');}
function makeFriendCode(){const name=document.getElementById('friendName').value.trim();if(!name){toast('Informe um nome ou apelido.');return;}S.settings.displayName=name;S.settings.shareId||=uid();save();const value={id:S.settings.shareId,name,points:pointsOf(todayKey()),streak:streak(),date:todayKey()};copyText('ASCEND2:'+btoa(unescape(encodeURIComponent(JSON.stringify(value)))));}
function parseFriendCode(text){const oldPrefix=KEY.split('_app_')[0].toUpperCase()+'2:',prefix=['ASCEND2:',oldPrefix].find(p=>text.startsWith(p));if(!prefix||text.length>8000)throw new Error('Código inválido');return JSON.parse(decodeURIComponent(escape(atob(text.slice(prefix.length)))));}
function importFriendCode(){try{const text=document.getElementById('friendCode').value.trim(),f=parseFriendCode(text);if(typeof f.name!=='string'||!f.name.trim()||typeof f.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(f.id)||!validRecordDate(f.date)||finiteNumber(f.points)===null||finiteNumber(f.streak)===null)throw 0;const clean={id:f.id,name:f.name.slice(0,60),date:f.date,points:f.points,streak:f.streak},old=S.friends.find(x=>x.id===f.id);if(old)Object.assign(old,clean);else S.friends.push(clean);save();openFriends();toast('Resumo do amigo salvo');}catch(e){toast('Código inválido. Peça um novo código ao seu amigo.');}}
function removeFriend(id){const f=S.friends.find(x=>x.id===id);S.friends=S.friends.filter(x=>x.id!==id);save();openFriends();toast('Amigo removido',()=>{if(f&&!S.friends.some(x=>x.id===id))S.friends.push(f);});}
function showInstall(){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),local=location.protocol==='file:';
  openModal('<h2>Leve sua rotina com você</h2>'+(local?'<p>Para instalar e ter cache offline, os três arquivos precisam ser abertos em um endereço HTTPS. Abrir só o HTML pelo gerenciador de arquivos não habilita a instalação.</p>':'<p>'+(ios?'No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”.':'No Chrome ou Edge, abra o menu e escolha “Instalar app” ou “Adicionar à tela inicial”.')+'</p>')+(installPrompt?'<button class="bt" onclick="installApp()">Instalar ASCEND</button>':'')+'<p class="sm mut">Depois da primeira visita com internet, o app poderá abrir offline. Seus dados continuam neste dispositivo. Antes de mudar de endereço, exporte um backup.</p><button class="gh full" onclick="closeModal()">Entendi</button>');
}
async function installApp(){if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;closeModal();}
async function checkUpdate(){try{const reg=await navigator.serviceWorker?.getRegistration();if(!reg){toast('Atualização disponível apenas quando o app é aberto por HTTPS ou localhost.');return;}await reg.update();toast(reg.waiting?'Nova versão pronta. Use o aviso no topo.':'Verificação concluída. Você será avisado quando houver uma nova versão.');}catch(e){toast('Não foi possível verificar. Tente de novo com internet.');}}

/* ============ LEMBRETES COM A PÁGINA ABERTA ============ */
let lastLocalDay='';
function checkReminders(){
  const now=new Date(),k=todayKey(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  if(lastLocalDay&&lastLocalDay!==k){S.ui.foodDay=k;syncGraceDays();render();}lastLocalDay=k;
  tasksOf(k).forEach(t=>{
    if(!t.remind||t.time!==hm||(S.days[k]?.done?.[t.id]?.full))return;
    const key=k+t.id+hm;window.__notified??={};if(window.__notified[key])return;window.__notified[key]=true;
    toast('Hora de: '+t.name);
    if(S.settings.notif&&'Notification' in window&&Notification.permission==='granted')try{new Notification('ASCEND',{body:'Hora de: '+t.name,tag:key});}catch(e){}
  });
}
setInterval(checkReminders,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders();});

/* ============ PRIMEIRO ACESSO ============ */
const ONB=[['today','Comece pelo seu dia','Crie uma tarefa, escolha quando ela se repete e quantos pontos vale. Você também pode começar com um modelo pronto.'],['target','Pequenos passos somam','Conclua tarefas ou subtarefas para ganhar pontos. Ao bater sua meta diária, você mantém a sequência e ganha uma estrela no calendário. Folgas preservam a sequência.'],['chart','Dê direção à sua evolução','Use Metas para objetivos maiores. Registre o valor atual e acompanhe seu ritmo. Em Progresso você encontra seus resultados e o relatório semanal.'],['book','Registre sem complicar','Treinos, refeições e dinheiro ficam em Registro. O botão de raio abre um registro rápido em qualquer aba. Nos Ajustes, baixe backups e personalize o app.']];
let onbI=0;
function showOnb(){onbI=0;document.getElementById('onb').classList.add('open');document.getElementById('app').inert=true;paintOnb();}
function paintOnb(){const o=ONB[onbI];document.getElementById('onbBody').innerHTML='<div class="onb-logo">ASCEND<span>Seu próximo passo começa aqui.</span></div><div class="onb-symbol">'+icon(o[0])+'</div><p class="sm mut" aria-live="polite">'+(onbI+1)+' de '+ONB.length+'</p><h2>'+o[1]+'</h2><p>'+o[2]+'</p><div class="dots" aria-hidden="true">'+ONB.map((_,i)=>'<i class="'+(i===onbI?'on':'')+'"></i>').join('')+'</div><button class="bt" onclick="nextOnb()">'+(onbI===ONB.length-1?'Começar minha rotina':'Continuar')+'</button>'+(onbI?'<button class="gh full" onclick="onbI--;paintOnb()">Voltar</button>':'')+'<button class="skip" onclick="closeOnb()">Pular tutorial</button>';document.querySelector('#onbBody .bt').focus();}
function nextOnb(){if(onbI<ONB.length-1){onbI++;paintOnb();}else closeOnb();}
function closeOnb(){document.getElementById('onb').classList.remove('open');document.getElementById('app').inert=false;S.settings.onboarded=true;save();document.getElementById('view').focus();}

/* ============ INICIALIZAÇÃO E PWA ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('gear').innerHTML=icon('gear');document.getElementById('quickButton').innerHTML=icon('bolt');
applyTheme();syncGraceDays();render();checkReminders();
if(LOAD_NOTICE){document.getElementById('storageError').hidden=false;document.getElementById('storageError').textContent=LOAD_NOTICE;}
if(STORAGE_BLOCKED||LOAD_NOTICE.includes('inválido'))document.getElementById('recoveryActions').hidden=false;
if(!S.settings.onboarded)showOnb();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
function showUpdate(worker){waitingWorker=worker;document.getElementById('updateNotice').hidden=false;}
function applyUpdate(){if(!waitingWorker||save()===false)return;waitingWorker.postMessage({type:'SKIP_WAITING'});}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    if(reg.waiting)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate(w);});});
  }).catch(()=>{document.getElementById('offlineNotice').hidden=false;});
  let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(waitingWorker&&!refreshing){refreshing=true;location.reload();}});
}

</script>
</body>
